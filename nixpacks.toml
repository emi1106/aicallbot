# nixpacks.toml for Railway deployment

# Phase 1: Install a complete set of system packages required by the Azure Speech SDK (a sub-dependency of vocode).
[phases.setup]
nixPkgs = ["...", "libuuid", "alsa-lib", "openssl_3"]

# Phase 2: Define how to start the app, setting the environment variable
# correctly before the command runs. This fixes the library path issue.
[start]
cmd = "LD_LIBRARY_PATH=${pkgs.lib.makeLibraryPath [ pkgs.libuuid pkgs.alsa-lib pkgs.openssl_3 ]} python main.py"